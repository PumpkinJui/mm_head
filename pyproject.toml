[project]
name = "mm_head"
version = "0.0.1"
description = "量筒的密室杀手配套脚本"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepdiff>=9.1.0",
    "pillow>=12.3.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pylint>=4.0.8",
    "ruff>=0.16.5",
]

[tool.pylint."messages control"]
disable = ["missing-module-docstring", "missing-class-docstring", "missing-function-docstring", "broad-exception-caught"]

[tool.ruff.format]
quote-style = "single"
